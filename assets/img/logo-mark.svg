<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 104" role="img" aria-label="TYBHC brain logo">
  <defs>
    <!-- gradients run from the midline (saturated) to the outer edge (lighter) -->
    <linearGradient id="tybhc-left" gradientUnits="userSpaceOnUse" x1="56" y1="20" x2="14" y2="84">
      <stop offset="0" stop-color="#3A5BEA"/>
      <stop offset="1" stop-color="#4FC3F7"/>
    </linearGradient>
    <linearGradient id="tybhc-right" gradientUnits="userSpaceOnUse" x1="56" y1="20" x2="14" y2="84">
      <stop offset="0" stop-color="#F0386F"/>
      <stop offset="1" stop-color="#B57CF0"/>
    </linearGradient>
    <!-- one hemisphere, drawn on the left; the right is its mirror image -->
    <g id="tybhc-hemi" fill="none" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M55 20 C55 12 49 8 42 8 C35 8 30 12 29 19 C21 19 15 26 15 34 C15 40 18 45 23 48 C17 51 14 57 14 64 C14 73 20 79 29 80 C30 88 35 94 43 94 C50 94 55 89 55 82 Z"/>
      <path d="M55 40 C47 40 41 35 41 27"/>
      <path d="M23 48 C30 48 35 52 35 59 C35 64 39 67 44 67"/>
      <path d="M29 80 C35 80 41 76 42 70"/>
    </g>
  </defs>
  <use href="#tybhc-hemi" stroke="url(#tybhc-left)"/>
  <use href="#tybhc-hemi" stroke="url(#tybhc-right)" transform="matrix(-1 0 0 1 120 0)"/>
</svg>
